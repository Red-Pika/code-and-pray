stages:
  - fmt
  - validate
  - plan

variables:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

fmt:
  stage: fmt
  image: hashicorp/terraform:1.9.8
  script:
    - terraform fmt -check -recursive terraform-multicloud-starter

validate:
  stage: validate
  image: hashicorp/terraform:1.9.8
  parallel:
    matrix:
      - MODULE:
          - aws/networking
          - aws/storage
          - aws/security
          - aws/database/rds-ha
          - azure/networking
          - azure/storage
          - azure/security
          - azure/database/azure-sql
          - gcp/networking
          - gcp/storage
          - gcp/security
          - gcp/database/cloud-sql-ha
  script:
    - cd "terraform-multicloud-starter/$MODULE"
    - terraform init -backend=false
    - terraform validate

# Plan/apply should be configured only after cloud credentials, remote state,
# and protected environment approvals are set up.
